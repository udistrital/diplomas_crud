version: '3.4'

services:
  diplomas_crud:
    image: golang:1.25-alpine
    container_name: ${API_NAME:-diplomas_crud}
    volumes:
      - go_src:/go
      - .:/go/src/${API_BASE_DIR:-github.com/udistrital}/${API_NAME:-diplomas_crud}
    environment:
      - GO111MODULE=on
    env_file:
      - .env
    ports:
      - "${DIPLOMAS_CRUD_HTTP_PORT:-8080}:${DIPLOMAS_CRUD_HTTP_PORT:-8080}"
    working_dir: /go/src
    command: sh -c 'cd ${API_BASE_DIR:-github.com/udistrital}/${API_NAME:-diplomas_crud}; go install github.com/beego/bee@latest; go mod tidy; bee run'
    networks:
      - back_end

  data_base:
    container_name: ${DIPLOMAS_LOCAL_DB:-diplomas_crud_db}
    image: postgres:16-alpine
    ports:
      - "${DIPLOMAS_CRUD_PGPORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DIPLOMAS_CRUD_PGUSER:-root}
      POSTGRES_PASSWORD: ${DIPLOMAS_CRUD_PGPASS:-password}
      POSTGRES_DB: ${DIPLOMAS_CRUD_PGDB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${DIPLOMAS_INIT_DIR:-../../../../../../DIPLOMA/db/init}:/docker-entrypoint-initdb.d:ro
    networks:
      - back_end

volumes:
  go_src:
  postgres_data:

networks:
  back_end:
    external: true
